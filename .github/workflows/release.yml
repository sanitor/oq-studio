name: Studio Release
on:
  push:
    tags: ['v*']
    branches: [master]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> $env:GITHUB_ENV
      - run: npm ci
      - run: npm run package:video-editor
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.os }}
          path: dist-desktop/*.zip
          if-no-files-found: error
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-*
          merge-multiple: true
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'b') }}
